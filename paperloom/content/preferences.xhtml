<groupbox>
	<label><html:h2>PaperLoom</html:h2></label>

	<!-- 直接把设置界面嵌进来：点进 PaperLoom 就能改，不用再点一次按钮。
	     内嵌页与独立窗口是同一份实现（settings.xhtml?embed=1）。 -->
	<html:iframe src="chrome://paperloom/content/settings.xhtml?embed=1"
		style="width:100%;height:620px;border:0;display:block;"></html:iframe>

	<description style="margin-top: 6px; opacity: 0.7;">
		若上方区域空白，可用「工具 → PaperLoom → 设置…」打开独立设置窗口。
	</description>
</groupbox>
