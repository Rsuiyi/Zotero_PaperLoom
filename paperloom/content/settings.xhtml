<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8" />
	<title>PaperLoom 设置</title>
	<link rel="stylesheet" href="chrome://paperloom/content/styles/paperloom.css" />
	<style>
		/* 设置窗口独立成页：不依赖 Zotero 设置面板的实现细节，任何版本都能打开 */
		body { font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 20px 24px 72px; color: #1f2328; background: #fff; }
		h1 { font-size: 18px; margin: 0 0 4px; }
		h2 { font-size: 14px; margin: 0 0 10px; color: #1f2328; }
		.pl-hint { color: #6a737d; margin: 0 0 18px; }
		section { border: 1px solid #e1e4e8; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
		.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
		.row > label { width: 150px; flex: none; color: #444d56; }
		.row input[type="text"], .row input[type="password"], .row input[type="number"] { flex: 1; padding: 5px 8px; border: 1px solid #d1d5da; border-radius: 5px; font: inherit; }
		.row .unit { color: #6a737d; font-size: 12px; }
		.desc { color: #6a737d; font-size: 12px; margin: 2px 0 0 160px; }
		footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px; background: #fafbfc; border-top: 1px solid #e1e4e8; display: flex; align-items: center; gap: 10px; }
		button { padding: 6px 14px; border: 1px solid #d1d5da; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
		button:hover { background: #f3f4f6; }
		button.pl-primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
		button.pl-primary:hover { background: #2860d0; }
		#status { margin-left: 8px; font-size: 12px; }
		#status.ok { color: #1a7f37; }
		#status.err { color: #cf222e; }
		#status.busy { color: #6a737d; }
	</style>
</head>
<body>
	<h1>PaperLoom 设置</h1>
	<p class="pl-hint">配置只保存在本机 Zotero 偏好中；只有提问时选中的上下文会发送到你填写的接口。</p>

	<section>
		<h2>大模型接口（OpenAI 兼容）</h2>

		<div class="row">
			<label for="apiBase">API Base URL</label>
			<input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1" />
		</div>
		<div class="desc">填到 <code>/v1</code> 为止，插件会自动拼接 <code>/chat/completions</code>。</div>

		<div class="row">
			<label for="apiKey">API Key</label>
			<input type="password" id="apiKey" placeholder="sk-..." />
			<button type="button" id="btn-eye" title="显示/隐藏">显示</button>
		</div>

		<div class="row">
			<label for="chatModel">对话模型</label>
			<input type="text" id="chatModel" placeholder="deepseek-chat" />
		</div>
		<div class="desc">回答问题时使用，建议选能力更强、上下文更长的模型。</div>

		<div class="row">
			<label for="extractModel">抽取模型</label>
			<input type="text" id="extractModel" placeholder="deepseek-chat" />
		</div>
		<div class="desc">建图谱、抽概念、抽记忆时使用，选便宜、速度快的模型即可。</div>

		<div class="row">
			<label for="maxTokens">max_tokens</label>
			<input type="number" id="maxTokens" min="1024" step="1024" />
			<span class="unit">≥ 4096 更稳</span>
		</div>
		<div class="desc">推理模型的 reasoning token 也计入 completion，给小了会出现空回答。</div>

		<div class="row">
			<label for="temperature">temperature</label>
			<input type="text" id="temperature" style="max-width:120px" />
			<span class="unit">0–2，问答建议 0.2–0.5</span>
		</div>

		<div class="row">
			<label for="timeoutMs">超时（毫秒）</label>
			<input type="number" id="timeoutMs" min="5000" step="5000" style="max-width:160px" />
		</div>

		<div class="row">
			<label for="useCache">缓存结果</label>
			<input type="checkbox" id="useCache" />
			<span class="unit">按提示词哈希缓存，开发期重复调试不烧钱</span>
		</div>
	</section>

	<section>
		<h2>存储</h2>
		<div class="row">
			<label for="dataDir">数据目录</label>
			<input type="text" id="dataDir" placeholder="留空 = Zotero 数据目录/paperloom" />
		</div>
		<div class="row">
			<label>当前实际位置</label>
			<span id="resolvedDir" class="unit">—</span>
		</div>
	</section>

	<footer>
		<button id="btn-save" class="pl-primary">保存</button>
		<button id="btn-test">测试连接</button>
		<button id="btn-close">关闭</button>
		<span id="status"></span>
	</footer>

	<script src="chrome://paperloom/content/settings.js"></script>
</body>
</html>
